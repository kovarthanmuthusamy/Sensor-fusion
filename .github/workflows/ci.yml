name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: The Makefile parses (a dry run; make is not installed on every developer machine)
        run: make help && make -n check docker-build load-test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # CI has no GPU: the CPU wheel is a fraction of the CUDA one's size.
      # Same torch version as requirements.lock.txt, so CI tests what we run locally.
      - name: Install PyTorch (CPU)
        run: pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,serve]"
      - run: mypy
      - run: pytest --cov --cov-report=term-missing

  # Builds the CPU image of the service, starts it on a random-weight model, and sends it a real
  # request (photo + LiDAR points + calibration). It cannot be run on the lab workstation (no Docker).
  serve-container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install PyTorch (CPU)
        run: pip install torch==2.14.1 torchvision==0.29.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,serve]"
      - name: Write a random-weight model and a sample request
        run: python scripts/make_test_model.py ci
      - run: docker build --build-arg GIT_COMMIT=${{ github.sha }} -t sensor-fusion-serve .
      - name: Start the service
        run: docker run -d --name svc -p 8000:8000 -v "$PWD/ci/model:/models:ro" sensor-fusion-serve
      - name: Wait until it is healthy
        run: |
          for i in $(seq 1 60); do curl -fsS http://localhost:8000/ready && exit 0; sleep 2; done
          docker logs svc
          exit 1
      - run: curl -fsS http://localhost:8000/version
      - name: Metrics are exposed
        run: curl -fsS http://localhost:8000/metrics | grep -q http_requests_total
      - name: The container does not run as root
        run: test "$(docker exec svc id -u)" != "0"
      - name: Detect
        run: |
          curl -fsS -F image=@ci/image.png -F lidar=@ci/lidar.npy \
            -F "calibration=<ci/calibration.json" -F score_threshold=0.0 \
            http://localhost:8000/detect | python -c "import json,sys; d=json.load(sys.stdin); assert d['detections'], d; print(len(d['detections']), 'detections')"
      - name: A bad request must be refused, not crash the service
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -F image=@ci/lidar.npy http://localhost:8000/detect)
          test "$code" = "422"
          curl -fsS http://localhost:8000/health
      - if: failure()
        run: docker logs svc
