[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-fusion"
version = "0.1.0"
description = "Camera + LiDAR fusion for night-time 2D object detection and distance estimation on nuScenes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Install torch/torchvision from the CUDA 12.6 index first (see README);
    # pip then treats these ranges as already satisfied.
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "numpy>=1.26,<2",  # nuscenes-devkit requires numpy<2
    "nuscenes-devkit>=1.2",
    "pillow>=10.1",  # image decoding in the dataset; ImageFont.load_default(size=) in scripts
    "hydra-core>=1.3.2,<1.4",
    "wandb>=0.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "mypy>=2.4",
    "ruff==0.17.1",  # keep in sync with .pre-commit-config.yaml
    "pre-commit>=4.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes: unused imports, undefined names
    "I",       # import sorting
    "B",       # bugbear: likely bugs (mutable defaults, loop-variable capture, ...)
    "UP",      # pyupgrade: modern syntax for the target Python
    "SIM",     # simplifications
    "NPY",     # numpy: legacy np.random API, deprecated aliases
    "RUF",     # ruff-specific (incl. ambiguous unicode characters)
]

[tool.mypy]
python_version = "3.11"
files = ["src"]
mypy_path = "src"
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["nuscenes.*", "pyquaternion.*", "torchvision.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["gpu: needs a CUDA GPU (skipped when none is available)"]

[tool.coverage.run]
source = ["sensor_fusion"]
branch = true
