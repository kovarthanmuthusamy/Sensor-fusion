# Input preparation and target painting. Shared by baseline and fusion (ADR 0006): the only
# thing that differs between them is model.in_channels.
downscale: 2            # photo and depth shrunk by this integer factor: 1600x900 -> 800x450, cropped to 800x448
depth_max_m: 100.0      # depth channel = depth / depth_max_m, clipped to [0, 1]; 0 stays "no LiDAR return"
flip_prob: 0.5          # probability of a left-right mirror, training only
rgb_mean: [0.485, 0.456, 0.406]  # ImageNet statistics: the backbone is ImageNet-pretrained
rgb_std: [0.229, 0.224, 0.225]
output_stride: 4        # the network's output grid is the input size / output_stride
peak_alpha: 0.54        # target peak width per axis = peak_alpha * object size in cells / 6 (TTFNet)
